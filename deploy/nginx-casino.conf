# Reverse proxy nginx (frontal HTTPS) -> conteneur casino sur le serveur Proxmox.
# Certificat Let's Encrypt géré par Certbot. Les en-têtes Upgrade/Connection
# sont indispensables pour les WebSockets (socket.io) de la roulette.
map $http_upgrade $casino_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name casino.yfufri.fr;

    location / {
        proxy_pass http://192.168.1.70:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $casino_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/casino.yfufri.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/casino.yfufri.fr/privkey.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name casino.yfufri.fr;
    return 301 https://$host$request_uri;
}
